plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'm.co.rh.id.apoi_spreadsheet.base'
    compileSdk 37

    defaultConfig {
        minSdk 26

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes.remove('META-INF/LICENSE.txt')
            excludes.remove('META-INF/NOTICE.txt')
            pickFirsts += 'META-INF/LICENSE-a-poi-spreadsheet.txt'
            pickFirsts += 'META-INF/NOTICE-a-poi-spreadsheet.txt'
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api 'androidx.graphics:graphics-path:1.0.0-rc01'
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = 'com.github.rh-id'
                artifactId = 'a-poi-spreadsheet-base'
                version = '0.0.7'
                pom {
                    name = 'a-poi-spreadsheet-base'
                    description = 'Apache POI spreadsheet support for Android - core compatibility module providing Graphics2D bridge, XML constants and POISpreadsheetContext'
                    url = 'https://github.com/rh-id/a-poi-spreadsheet'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'rh-id'
                            name = 'Ruby Hartono'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/rh-id/a-poi-spreadsheet.git'
                        developerConnection = 'scm:git:ssh://github.com/rh-id/a-poi-spreadsheet.git'
                        url = 'https://github.com/rh-id/a-poi-spreadsheet/tree/master'
                    }
                }
            }
        }
    }
}
