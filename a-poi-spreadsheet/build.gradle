plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'm.co.rh.id.apoi_spreadsheet'
    compileSdk 37

    defaultConfig {
        minSdk 26

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Single-artifact consolidation: the former :base/:poi/:poi-ooxml module source
            // trees are reused in place via a srcDirs union - no source file was moved or copied.
            java.srcDirs = ['../base/src/main/java', '../poi/src/main/java', '../poi-ooxml/src/main/java']
            assets.srcDirs = ['../poi/src/main/assets', '../poi-ooxml/src/main/assets']
            // Java resources are self-contained in this module: the META-INF legal files
            // (single copy, identical across the three former modules) and the ServiceLoader
            // provider registrations merged from the former poi and poi-ooxml META-INF/services
            // files (each former module registered only its own factories, so a content merge -
            // not a duplicate-dir reference or pickFirst - is required to keep both HSSF and
            // XSSF/OOXML providers).
            resources.srcDirs = ['src/main/resources']
        }
        androidTest {
            java.srcDirs = ['../poi-ooxml/src/androidTest/java']
            assets.srcDirs = ['../poi-ooxml/src/androidTest/assets']
        }
    }

    packaging {
        exclude 'META-INF/DEPENDENCIES'
        resources {
            excludes.remove('META-INF/LICENSE.txt')
            excludes.remove('META-INF/NOTICE.txt')
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // former :base
    api 'androidx.graphics:graphics-path:1.0.0-rc01'

    // former :poi
    api 'xerces:xercesImpl:2.12.2'
    api 'com.fasterxml:aalto-xml:1.3.1'
    api "commons-io:commons-io:2.21.0"
    api 'org.apache.commons:commons-collections4:4.5.0'
    api "org.apache.commons:commons-compress:1.28.0"
    api 'com.zaxxer:SparseBitSet:1.3'
    api "org.apache.commons:commons-math3:3.6.1"
    api "commons-codec:commons-codec:1.20.0"

    // former :poi-ooxml
    // poi-ooxml-full schema types (org.openxmlformats.schemas.**) appear in public API
    // signatures, so this is exposed transitively as an api dependency
    api 'org.apache.poi:poi-ooxml-full:5.5.1'
    implementation 'javax.xml.crypto:jsr105-api:1.0.1'
    implementation 'org.apache.santuario:xmlsec:3.0.6'
    // xmlbeans 5.x requires log4j-api classes at runtime (logging-only shim; no backend bundled, output stays silent)
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'

    // (Required) Writing and executing Unit Tests on the JUnit Platform
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'org.mockito:mockito-android:5.10.0'
    androidTestImplementation 'com.github.rzymek:opczip:1.2.0'
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = 'com.github.rh-id'
                artifactId = 'a-poi-spreadsheet'
                version = '0.1.0'
                pom {
                    name = 'a-poi-spreadsheet'
                    description = 'Apache POI spreadsheet support for Android - HSSF (.xls) and XSSF (.xlsx) support adapted from Apache POI with Log4J replaced by android.util.Log'
                    url = 'https://github.com/rh-id/a-poi-spreadsheet'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'rh-id'
                            name = 'Ruby Hartono'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/rh-id/a-poi-spreadsheet.git'
                        developerConnection = 'scm:git:ssh://github.com/rh-id/a-poi-spreadsheet.git'
                        url = 'https://github.com/rh-id/a-poi-spreadsheet/tree/master'
                    }
                }
            }
        }
    }
}
