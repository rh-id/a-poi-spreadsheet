plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'm.co.rh.id.apoi_spreadsheet.poi'
    compileSdk 37

    defaultConfig {
        minSdk 26

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes.remove('META-INF/LICENSE.txt')
            excludes.remove('META-INF/NOTICE.txt')
            pickFirsts += 'META-INF/LICENSE-a-poi-spreadsheet.txt'
            pickFirsts += 'META-INF/NOTICE-a-poi-spreadsheet.txt'
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation project(':base')
    api 'xerces:xercesImpl:2.12.2'
    api 'com.fasterxml:aalto-xml:1.3.1'

    api "commons-io:commons-io:2.21.0"
    api 'org.apache.commons:commons-collections4:4.5.0'
    api "org.apache.commons:commons-compress:1.28.0"
    api 'com.zaxxer:SparseBitSet:1.3'
    api "org.apache.commons:commons-math3:3.6.1"
    api "commons-codec:commons-codec:1.20.0"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = 'com.github.rh-id'
                artifactId = 'a-poi-spreadsheet'
                version = '0.0.6'
                pom {
                    name = 'a-poi-spreadsheet'
                    description = 'Apache POI spreadsheet support for Android - HSSF/XSSF-common core adapted from Apache POI with Log4J replaced by android.util.Log'
                    url = 'https://github.com/rh-id/a-poi-spreadsheet'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'rh-id'
                            name = 'Ruby Hartono'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/rh-id/a-poi-spreadsheet.git'
                        developerConnection = 'scm:git:ssh://github.com/rh-id/a-poi-spreadsheet.git'
                        url = 'https://github.com/rh-id/a-poi-spreadsheet/tree/master'
                    }
                }
            }
        }
    }
}
